<text x="30.0" y="58.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9198a1" font-weight="normal" text-anchor="start">An orbit camera: nothing places the eye. A script writes a look at point, two angles and a distance, and the eye is rebuilt from them every tick.</text>
