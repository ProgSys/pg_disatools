<text x="578.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">Yaw turns towards −x, so the default −45° puts the eye on the +x side of the map.</text>
<rect x="30.0" y="430.0" width="500.0" height="262.0" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="48.0" y="457.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">The lens − what SetCameraFOV changes</text>
<polygon points="90.0,560.0 383.1,496.1 383.1,623.9" fill="#9198a1" fill-opacity="0.16" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 4"/>
