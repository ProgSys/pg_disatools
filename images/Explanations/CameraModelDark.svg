<text x="48.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">The game's y grows downward, so the pitch that looks down is the negative one: −30°</text>
<text x="48.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">is the default.</text>
