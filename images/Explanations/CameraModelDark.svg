<g transform="translate(90.0 560.0) rotate(0.00)">
<rect x="-13" y="-9" width="22" height="18" rx="3" fill="#79b8f3"/>
<polygon points="9,-8 21,-14 21,14 9,8" fill="#79b8f3"/>
</g>
<text x="402.0" y="496.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9198a1" font-weight="bold" text-anchor="start">argument 1000</text>
<text x="402.0" y="511.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9198a1" font-weight="normal" text-anchor="start">lens 62.5, ≈ 25°</text>
<text x="402.0" y="566.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#79b8f3" font-weight="bold" text-anchor="start">argument 0</text>
<text x="402.0" y="581.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#79b8f3" font-weight="normal" text-anchor="start">lens 320, ≈ 4.9°</text>
<text x="48.0" y="652.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">The argument is divided by 16 to give the lens, and a bigger lens is a narrower view: it</text>
<text x="48.0" y="668.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">is a focal length, not an angle. An argument of 0 picks the default lens of 320, a very</text>
<text x="48.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">long one, and it is the 750 unit distance that still makes the map fill the screen.</text>
<rect x="560.0" y="430.0" width="470.0" height="262.0" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="578.0" y="457.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="bold" text-anchor="start">How the eye is rebuilt, every tick</text>
<text x="584.0" y="490.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="12.5" fill="#e6edf3" font-weight="normal" text-anchor="start">horizontal = |distance * cos(pitch)|</text>
<text x="584.0" y="511.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="12.5" fill="#e6edf3" font-weight="normal" text-anchor="start">eye.y = center.y + distance * sin(pitch)</text>
<text x="584.0" y="532.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="12.5" fill="#e6edf3" font-weight="normal" text-anchor="start">eye.x = center.x - horizontal * sin(yaw)</text>
<text x="584.0" y="553.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="12.5" fill="#e6edf3" font-weight="normal" text-anchor="start">eye.z = center.z - horizontal * cos(yaw)</text>
<line x1="584.0" y1="580.0" x2="1006.0" y2="580.0" stroke="#30363d" stroke-width="1.0" stroke-linecap="round"/>
<text x="584.0" y="598.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#e6edf3" font-weight="bold" text-anchor="start">look at point</text>
<text x="692.0" y="598.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#79b8f3" font-weight="normal" text-anchor="start">SetCameraPos</text>
<text x="1006.0" y="598.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9198a1" font-weight="normal" text-anchor="end">script units, 120 = 1 tile</text>
<text x="584.0" y="619.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#e6edf3" font-weight="bold" text-anchor="start">distance</text>
<text x="692.0" y="619.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#79b8f3" font-weight="normal" text-anchor="start">SetCameraZoom</text>
<text x="1006.0" y="619.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9198a1" font-weight="normal" text-anchor="end">world units, 12 = 1 tile</text>
<text x="584.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#e6edf3" font-weight="bold" text-anchor="start">pitch and yaw</text>
<text x="692.0" y="640.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#79b8f3" font-weight="normal" text-anchor="start">SetCameraRotation</text>
<text x="1006.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9198a1" font-weight="normal" text-anchor="end">whole degrees</text>
<text x="584.0" y="661.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#e6edf3" font-weight="bold" text-anchor="start">lens</text>
<text x="692.0" y="661.0" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#79b8f3" font-weight="normal" text-anchor="start">SetCameraFOV</text>
<text x="1006.0" y="661.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#9198a1" font-weight="normal" text-anchor="end">value / 16, 0 picks 320</text>
<text x="584.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#9198a1" font-weight="normal" text-anchor="start">Starting values: distance 750, pitch −30°, yaw 0°, lens 320.</text>
</svg>